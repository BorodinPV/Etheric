hint.common.clientId=Unique OAuth client identifier used in authorization and token requests. Leave blank when creating to auto-generate.
hint.common.name=Display name shown in the admin console and on consent screens.
hint.common.description=Optional short description of the client application.
hint.common.scopes=OAuth scopes this client may request (e.g. openid, profile, email). Space or comma separated.
hint.common.grantTypes=Allowed OAuth grant types (e.g. authorization_code, refresh_token).
hint.common.username=Login name for the user account.
hint.common.email=Contact email address for the user.
hint.common.roles=Authorization roles for the user (e.g. user, admin). Space or comma separated.
hint.common.password=Initial password for the new user. Minimum 8 characters.
hint.common.enabled=When disabled, the client or user cannot authenticate or authorize.

hint.client.redirectUris=Allowed callback URLs after authorization. One URI per line. Must exactly match redirect_uri in OAuth requests.
hint.client.sessionCookieName=Browser cookie name for the login session. Leave blank to use the server default.
hint.client.secureCookieFlag=Whether session cookies require HTTPS. Choose server default, force Secure, or allow non-HTTPS (development only).
hint.client.accessTokenLifetime=How long access tokens remain valid, in seconds. Blank uses the server default.
hint.client.refreshTokenLifetime=How long refresh tokens remain valid, in seconds. Blank uses the server default.
hint.client.sessionLifetime=How long the browser login session lasts, in seconds. Blank uses the server default.
hint.client.clientSecret=Secret used by the client for token endpoint authentication. Shown only once after creation or regeneration.
hint.client.regenerateSecret=Issues a new client secret immediately. The previous secret stops working at once.
hint.client.usersMembership=Users selected here may sign in and authorize with this OAuth client.

hint.server.oauthSessionCookieName=Name of the browser cookie that stores the user's login session at the authorization server (default: SESSIONID).
hint.server.oauthSessionLifetime=Duration of the login session cookie, in seconds.
hint.server.defaultAccessTokenLifetime=Default access token lifetime for clients without their own override, in seconds.
hint.server.defaultRefreshTokenLifetime=Default refresh token lifetime for clients without their own override, in seconds.
hint.server.secureCookieFlag=When enabled, session cookies are sent only over HTTPS.

hint.user.newPassword=New password for this user. Minimum 8 characters. Replaces the current password immediately.
hint.user.clientsMembership=OAuth clients this user may access. Membership is required to authorize with a client.
