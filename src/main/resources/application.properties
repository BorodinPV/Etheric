# ========================
# Etheric OAuth 2.0 Server
# ========================

# HTTP Configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Dev mode uses docker-compose (see README), not Quarkus Dev Services
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.redis.devservices.enabled=false
%dev.quarkus.test.continuous-testing=disabled
%dev.etheric.docker-compose.auto-start=true
%prod.etheric.docker-compose.auto-start=false

# ========================
# PostgreSQL Configuration
# ========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ETHERIC_DB_USER:etheric}
quarkus.datasource.password=${ETHERIC_DB_PASSWORD:etheric}
quarkus.datasource.reactive.url=${ETHERIC_DB_REACTIVE_URL:postgresql://localhost:5432/etheric}
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.idle-timeout=PT5M
quarkus.datasource.jdbc.url=${ETHERIC_DB_JDBC_URL:jdbc:postgresql://localhost:5432/etheric}

# Hibernate ORM (Reactive Panache)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true

# Flyway (JDBC)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# ========================
# Redis Configuration
# ========================
quarkus.redis.hosts=${ETHERIC_REDIS_URL:redis://localhost:6379}
quarkus.redis.max-pool-size=10

# ========================
# JWT Configuration
# ========================
# Token lifetimes (in seconds)
etheric.jwt.access-token-lifetime=3600
etheric.jwt.refresh-token-lifetime=604800
etheric.jwt.authorization-code-lifetime=600
etheric.jwt.session-lifetime=28800
etheric.jwt.request-state-lifetime=600

# JWT signing
etheric.jwt.issuer=${ETHERIC_JWT_ISSUER:etheric}
etheric.jwt.algorithm=RS256
# Paths to keys (relative to resources or absolute)
etheric.jwt.private-key-location=keys/private.pem
etheric.jwt.public-key-location=keys/public.pem

# ========================
# Qute Template Engine
# ========================
quarkus.qute.suffixes=html

# ========================
# CORS Configuration
# ========================
# Production default: CORS disabled. Enable only with explicit origins (never * with credentials).
quarkus.http.cors=${ETHERIC_CORS_ENABLED:false}
quarkus.http.cors.origins=${ETHERIC_CORS_ORIGINS:}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.access-control-allow-credentials=true

# Dev profile: explicit localhost origins for SPA + server on 8080
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://localhost:5173

# ========================
# Session Cookie
# ========================
etheric.session.cookie.secure=true
%dev.etheric.session.cookie.secure=false

# ========================
# Admin API
# ========================
etheric.admin.api-key=${ETHERIC_ADMIN_API_KEY:change-me-admin-key}
%dev.etheric.admin.api-key=dev-admin-key
%test.etheric.admin.api-key=test-admin-key
etheric.admin.session-lifetime=28800
etheric.admin.console-path=/admin/console

# ========================
# Logging Configuration
# ========================
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.console.darken=1

# Access log without headers (avoids leaking Cookie / Authorization)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b

# ========================
# Rate Limiting
# ========================
etheric.rate-limit.enabled=true
etheric.rate-limit.window-seconds=60
etheric.rate-limit.authorize-max=60
etheric.rate-limit.login-max=20
etheric.rate-limit.token-max=30
etheric.rate-limit.consent-max=20

# ========================
# User Registration
# ========================
etheric.registration.enabled=true

# ========================
# Local Cache (Caffeine)
# ========================
etheric.cache.client-ttl-seconds=60
etheric.cache.consent-ttl-seconds=2592000
quarkus.cache.caffeine.clients.expire-after-write=60S

# ========================
# Graceful Shutdown
# ========================
quarkus.shutdown.timeout=PT30S

# ========================
# Health Check
# ========================
quarkus.smallrye-health.enabled=true
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/health/ready
