# ========================
# Etheric OAuth 2.0 Server
# ========================

# HTTP Configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# ========================
# PostgreSQL Configuration
# ========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=etheric
quarkus.datasource.password=etheric
quarkus.datasource.reactive.url=postgresql://localhost:5432/etheric
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.idle-timeout=PT5M
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/etheric

# Hibernate ORM (Reactive Panache)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true

# Flyway (JDBC)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# ========================
# Redis Configuration
# ========================
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.max-pool-size=10

# ========================
# JWT Configuration
# ========================
# Token lifetimes (in seconds)
etheric.jwt.access-token-lifetime=3600
etheric.jwt.refresh-token-lifetime=604800
etheric.jwt.authorization-code-lifetime=600
etheric.jwt.session-lifetime=28800
etheric.jwt.request-state-lifetime=600

# JWT signing
etheric.jwt.issuer=etheric
etheric.jwt.algorithm=RS256
# Paths to keys (relative to resources or absolute)
etheric.jwt.private-key-location=keys/private.pem
etheric.jwt.public-key-location=keys/public.pem

# ========================
# Qute Template Engine
# ========================
quarkus.qute.suffixes=html

# ========================
# CORS Configuration
# ========================
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.access-control-allow-credentials=true

# ========================
# Session Cookie
# ========================
etheric.session.cookie.secure=true
%dev.etheric.session.cookie.secure=false

# ========================
# Admin API
# ========================
etheric.admin.api-key=change-me-admin-key
%dev.etheric.admin.api-key=dev-admin-key
%test.etheric.admin.api-key=test-admin-key

# ========================
# Logging Configuration
# ========================
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.console.darken=1

# Access log without headers (avoids leaking Cookie / Authorization)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b

# ========================
# Graceful Shutdown
# ========================
quarkus.shutdown.timeout=PT30S

# ========================
# Health Check
# ========================
quarkus.smallrye-health.enabled=true
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/health/ready
