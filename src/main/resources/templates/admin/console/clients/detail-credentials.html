<div class="pf-c-tabs">
    <a class="pf-c-tabs__link {#if activeTab == 'settings'}active{/if}" href="/admin/console/clients/{clientId}/settings">Settings</a>
    <a class="pf-c-tabs__link {#if activeTab == 'credentials'}active{/if}" href="/admin/console/clients/{clientId}/credentials">Credentials</a>
</div>

{#if flash}
<div class="pf-c-alert pf-m-warning">
    <strong>{flash.message}</strong>
    <div class="pf-c-secret-box" id="client-secret">{flash.clientSecret}</div>
    <button class="pf-c-button pf-m-secondary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('client-secret').textContent)">Copy secret</button>
</div>
{/if}

<div class="pf-c-description-list">
    <div class="pf-c-description-list__term">Client ID</div>
    <div class="pf-c-description-list__description">{client.clientId}</div>

    <div class="pf-c-description-list__term">Client secret</div>
    <div class="pf-c-description-list__description">
        {#if flash}
        Shown above — copy it now.
        {#else}
        Hidden for security. Regenerate to issue a new secret.
        {/if}
    </div>
</div>

<form method="post" action="/admin/console/clients/{clientId}/credentials" style="margin-top:24px">
    <input type="hidden" name="csrf_token" value="{csrfToken}">
    <button class="pf-c-button pf-m-danger" type="submit">Regenerate client secret</button>
    <div class="pf-c-form__helper">The current secret will stop working immediately.</div>
</form>
