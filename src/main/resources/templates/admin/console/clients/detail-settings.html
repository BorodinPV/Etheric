<div class="pf-c-tabs">
    <a class="pf-c-tabs__link {#if activeTab == 'settings'}active{/if}" href="/admin/console/clients/{clientId}/settings">Settings</a>
    <a class="pf-c-tabs__link {#if activeTab == 'credentials'}active{/if}" href="/admin/console/clients/{clientId}/credentials">Credentials</a>
    <a class="pf-c-tabs__link {#if activeTab == 'users'}active{/if}" href="/admin/console/clients/{clientId}/users">Users</a>
</div>

{#if success}
<div class="pf-c-alert pf-m-success">{success}</div>
{/if}
{#if error}
<div class="pf-c-alert pf-m-danger">{error}</div>
{/if}

<form method="post" action="/admin/console/clients/{clientId}/settings">
    <input type="hidden" name="csrf_token" value="{csrfToken}">

    <div class="pf-c-form__group">
        <label class="pf-c-form__label">Client ID</label>
        <input class="pf-c-form-control" type="text" value="{client.clientId}" disabled>
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="client_name">Name *</label>
        <input class="pf-c-form-control" type="text" id="client_name" name="client_name" value="{client.clientName}" required>
    </div>

    <div class="pf-c-form__group pf-c-checkbox">
        <label><input type="checkbox" name="enabled" {#if client.enabled}checked{/if}> Enabled</label>
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="redirect_uris">Redirect URIs *</label>
        <textarea class="pf-c-form-control" id="redirect_uris" name="redirect_uris" required>{#for uri in client.redirectUris}{uri}
{/for}</textarea>
        <div class="pf-c-form__helper">One redirect URI per line</div>
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="scopes">Scopes</label>
        <input class="pf-c-form-control" type="text" id="scopes" name="scopes" value="{#for s in client.scopes}{s} {/for}">
        <div class="pf-c-form__helper">Space or comma separated</div>
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="grant_types">Grant types</label>
        <input class="pf-c-form-control" type="text" id="grant_types" name="grant_types" value="{#for g in client.grantTypes}{g} {/for}">
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="client_description">Description</label>
        <input class="pf-c-form-control" type="text" id="client_description" name="client_description" value="{client.clientDescription}">
    </div>

    <h2>Token &amp; session overrides</h2>
    <p>Leave blank to use server defaults from <a href="/admin/console/settings">Server settings</a>.</p>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="access_token_lifetime_seconds">Access token lifetime (seconds)</label>
        <input class="pf-c-form-control" type="number" id="access_token_lifetime_seconds" name="access_token_lifetime_seconds"
               value="{client.accessTokenLifetimeSeconds}" min="1">
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="refresh_token_lifetime_seconds">Refresh token lifetime (seconds)</label>
        <input class="pf-c-form-control" type="number" id="refresh_token_lifetime_seconds" name="refresh_token_lifetime_seconds"
               value="{client.refreshTokenLifetimeSeconds}" min="1">
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="session_lifetime_seconds">OAuth session lifetime (seconds)</label>
        <input class="pf-c-form-control" type="number" id="session_lifetime_seconds" name="session_lifetime_seconds"
               value="{client.sessionLifetimeSeconds}" min="1">
    </div>

    <button class="pf-c-button pf-m-primary" type="submit">Save</button>
</form>
