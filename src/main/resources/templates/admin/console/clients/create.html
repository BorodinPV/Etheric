{#if error}
<div class="pf-c-alert pf-m-danger">{error}</div>
{/if}

<form method="post" action="{consolePath}/clients/create">
    <input type="hidden" name="csrf_token" value="{csrfToken}">

    <div class="ec-card">
        <div class="pf-c-form__group">
            <label class="pf-c-form__label pf-c-form__label--with-hint" for="client_id">
                <span>{i18n.get('common.clientId')}</span>
                {#include admin/console/field-hint text=i18n.get('hint.common.clientId') /}
            </label>
            <input class="pf-c-form-control" type="text" id="client_id" name="client_id" placeholder="{i18n.get('client.create.placeholderClientId')}">
        </div>

        <div class="pf-c-form__group">
            <label class="pf-c-form__label pf-c-form__label--with-hint" for="client_name">
                <span>{i18n.get('common.name')} *</span>
                {#include admin/console/field-hint text=i18n.get('hint.common.name') /}
            </label>
            <input class="pf-c-form-control" type="text" id="client_name" name="client_name" required>
        </div>

        <div class="pf-c-form__group">
            <label class="pf-c-form__label pf-c-form__label--with-hint" for="redirect_uris">
                <span>{i18n.get('client.settings.redirectUris')} *</span>
                {#include admin/console/field-hint text=i18n.get('hint.client.redirectUris') /}
            </label>
            <textarea class="pf-c-form-control" id="redirect_uris" name="redirect_uris" required placeholder="{i18n.get('client.create.placeholderRedirectUris')}"></textarea>
            <p class="pf-c-form__helper">{i18n.get('common.helper.oneUriPerLine')}</p>
        </div>

        <div class="pf-c-form__group">
            <label class="pf-c-form__label pf-c-form__label--with-hint" for="scopes">
                <span>{i18n.get('common.scopes')}</span>
                {#include admin/console/field-hint text=i18n.get('hint.common.scopes') /}
            </label>
            <input class="pf-c-form-control" type="text" id="scopes" name="scopes" value="openid profile email">
            <p class="pf-c-form__helper">{i18n.get('common.helper.spaceCommaSeparated')}</p>
        </div>

        <div class="pf-c-form__group">
            <label class="pf-c-form__label pf-c-form__label--with-hint" for="grant_types">
                <span>{i18n.get('common.grantTypes')}</span>
                {#include admin/console/field-hint text=i18n.get('hint.common.grantTypes') /}
            </label>
            <input class="pf-c-form-control" type="text" id="grant_types" name="grant_types" value="authorization_code refresh_token">
        </div>

        <div class="pf-c-form__group">
            <label class="pf-c-form__label pf-c-form__label--with-hint" for="client_description">
                <span>{i18n.get('common.description')}</span>
                {#include admin/console/field-hint text=i18n.get('hint.common.description') /}
            </label>
            <input class="pf-c-form-control" type="text" id="client_description" name="client_description">
        </div>

        <h2 class="ec-section-title">{i18n.get('client.settings.oauthSession')}</h2>
        <p class="ec-section-description">{i18n.get('client.settings.oauthSessionIntro')}</p>

        <div class="pf-c-form__group">
            <label class="pf-c-form__label pf-c-form__label--with-hint" for="session_cookie_name">
                <span>{i18n.get('client.settings.sessionCookieName')} *</span>
                {#include admin/console/field-hint text=i18n.get('hint.client.sessionCookieName') /}
            </label>
            <input class="pf-c-form-control" type="text" id="session_cookie_name" name="session_cookie_name"
                   value="{defaults.sessionCookieName}" required pattern="[A-Za-z0-9_-]+">
        </div>

        <div class="pf-c-form__group pf-c-checkbox">
            <label class="pf-c-form__label--with-hint">
                <input type="checkbox" name="session_cookie_secure" {#if defaults.sessionCookieSecure}checked{/if}>
                <span>{i18n.get('client.settings.secureCookieFlag')}</span>
                {#include admin/console/field-hint text=i18n.get('hint.client.secureCookieFlag') /}
            </label>
        </div>

        <div class="ec-form-grid">
            <div class="pf-c-form__group">
                <label class="pf-c-form__label pf-c-form__label--with-hint" for="access_token_lifetime_seconds">
                    <span>{i18n.get('client.settings.accessTokenLifetime')} *</span>
                    {#include admin/console/field-hint text=i18n.get('hint.client.accessTokenLifetime') /}
                </label>
                <input class="pf-c-form-control" type="number" id="access_token_lifetime_seconds" name="access_token_lifetime_seconds"
                       value="{defaults.accessTokenLifetimeSeconds}" min="1" required>
            </div>

            <div class="pf-c-form__group">
                <label class="pf-c-form__label pf-c-form__label--with-hint" for="refresh_token_lifetime_seconds">
                    <span>{i18n.get('client.settings.refreshTokenLifetime')} *</span>
                    {#include admin/console/field-hint text=i18n.get('hint.client.refreshTokenLifetime') /}
                </label>
                <input class="pf-c-form-control" type="number" id="refresh_token_lifetime_seconds" name="refresh_token_lifetime_seconds"
                       value="{defaults.refreshTokenLifetimeSeconds}" min="1" required>
            </div>

            <div class="pf-c-form__group">
                <label class="pf-c-form__label pf-c-form__label--with-hint" for="session_lifetime_seconds">
                    <span>{i18n.get('client.settings.sessionLifetime')} *</span>
                    {#include admin/console/field-hint text=i18n.get('hint.client.sessionLifetime') /}
                </label>
                <input class="pf-c-form-control" type="number" id="session_lifetime_seconds" name="session_lifetime_seconds"
                       value="{defaults.sessionLifetimeSeconds}" min="1" required>
            </div>
        </div>

        <div class="ec-form-actions">
            <button class="pf-c-button pf-m-primary" type="submit">{i18n.get('common.create')}</button>
            <a class="pf-c-button pf-m-secondary" href="{consolePath}/clients">{i18n.get('common.cancel')}</a>
        </div>
    </div>
</form>
