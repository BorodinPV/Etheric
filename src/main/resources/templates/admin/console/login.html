<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Etheric Admin</title>
    <link rel="stylesheet" href="/admin/admin-console.css">
</head>
<body>
<div class="pf-c-login">
    <div class="pf-c-login__card">
        <div class="pf-c-login__brand"><span>Etheric</span></div>
        <h1 class="pf-c-login__title">Sign in to your account</h1>
        <p class="pf-c-login__subtitle">Admin Console</p>
        {#if error}
        <div class="pf-c-alert pf-m-danger">{error}</div>
        {/if}
        <form method="post" action="/admin/console/login">
            <input type="hidden" name="csrf_token" value="{csrfToken}">
            {#if redirectUri}
            <input type="hidden" name="redirect_uri" value="{redirectUri}">
            {/if}
            <div class="pf-c-form__group">
                <label class="pf-c-form__label" for="username">Username</label>
                <input class="pf-c-form-control" type="text" id="username" name="username" required autofocus>
            </div>
            <div class="pf-c-form__group">
                <label class="pf-c-form__label" for="password">Password</label>
                <input class="pf-c-form-control" type="password" id="password" name="password" required>
            </div>
            <button class="pf-c-button pf-m-primary" type="submit" style="width:100%">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
