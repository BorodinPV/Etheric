<div class="pf-c-tabs">
    <a class="pf-c-tabs__link {#if activeTab == 'details'}active{/if}" href="/admin/console/users/{userId}/details">Details</a>
    <a class="pf-c-tabs__link {#if activeTab == 'credentials'}active{/if}" href="/admin/console/users/{userId}/credentials">Credentials</a>
    <a class="pf-c-tabs__link {#if activeTab == 'clients'}active{/if}" href="/admin/console/users/{userId}/clients">Clients</a>
</div>

{#if success}
<div class="pf-c-alert pf-m-success">{success}</div>
{/if}
{#if error}
<div class="pf-c-alert pf-m-danger">{error}</div>
{/if}

<form method="post" action="/admin/console/users/{userId}/details">
    <input type="hidden" name="csrf_token" value="{csrfToken}">

    <div class="pf-c-form__group">
        <label class="pf-c-form__label">Username</label>
        <input class="pf-c-form-control" type="text" value="{user.username}" disabled>
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="email">Email</label>
        <input class="pf-c-form-control" type="email" id="email" name="email" value="{user.email}">
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="roles">Roles</label>
        <input class="pf-c-form-control" type="text" id="roles" name="roles" value="{#for r in user.roles}{r} {/for}">
    </div>

    <div class="pf-c-form__group pf-c-checkbox">
        <label><input type="checkbox" name="enabled" {#if user.enabled}checked{/if}> Enabled</label>
    </div>

    <button class="pf-c-button pf-m-primary" type="submit">Save</button>
</form>
