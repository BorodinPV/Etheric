<div class="pf-c-tabs">
    <a class="pf-c-tabs__link {#if activeTab == 'details'}active{/if}" href="/admin/console/users/{userId}/details">Details</a>
    <a class="pf-c-tabs__link {#if activeTab == 'credentials'}active{/if}" href="/admin/console/users/{userId}/credentials">Credentials</a>
</div>

{#if success}
<div class="pf-c-alert pf-m-success">{success}</div>
{/if}
{#if error}
<div class="pf-c-alert pf-m-danger">{error}</div>
{/if}

<form method="post" action="/admin/console/users/{userId}/credentials">
    <input type="hidden" name="csrf_token" value="{csrfToken}">

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="new_password">New password</label>
        <input class="pf-c-form-control" type="password" id="new_password" name="new_password" required minlength="8">
        <div class="pf-c-form__helper">Minimum 8 characters</div>
    </div>

    <button class="pf-c-button pf-m-primary" type="submit">Reset password</button>
</form>
