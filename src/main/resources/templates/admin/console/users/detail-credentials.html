<div class="pf-c-tabs">
    <a class="pf-c-tabs__link {#if activeTab == 'details'}active{/if}" href="/admin/console/users/{userId}/details">{i18n.get('tab.details')}</a>
    <a class="pf-c-tabs__link {#if activeTab == 'credentials'}active{/if}" href="/admin/console/users/{userId}/credentials">{i18n.get('tab.credentials')}</a>
    <a class="pf-c-tabs__link {#if activeTab == 'clients'}active{/if}" href="/admin/console/users/{userId}/clients">{i18n.get('tab.clients')}</a>
</div>

{#if success}
<div class="pf-c-alert pf-m-success">{success}</div>
{/if}
{#if error}
<div class="pf-c-alert pf-m-danger">{error}</div>
{/if}

<form method="post" action="/admin/console/users/{userId}/credentials">
    <input type="hidden" name="csrf_token" value="{csrfToken}">

    <div class="pf-c-form__group">
        <label class="pf-c-form__label pf-c-form__label--with-hint" for="new_password">
            <span>{i18n.get('user.credentials.newPassword')}</span>
            {#include admin/console/field-hint text=i18n.get('hint.user.newPassword') /}
        </label>
        <input class="pf-c-form-control" type="password" id="new_password" name="new_password" required minlength="8">
    </div>

    <button class="pf-c-button pf-m-primary" type="submit">{i18n.get('user.credentials.resetPassword')}</button>
</form>
