{#if error}
<div class="pf-c-alert pf-m-danger">{error}</div>
{/if}

<form method="post" action="/admin/console/users/create">
    <input type="hidden" name="csrf_token" value="{csrfToken}">

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="username">Username *</label>
        <input class="pf-c-form-control" type="text" id="username" name="username" required>
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="password">Password *</label>
        <input class="pf-c-form-control" type="password" id="password" name="password" required minlength="8">
        <div class="pf-c-form__helper">Minimum 8 characters</div>
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="email">Email</label>
        <input class="pf-c-form-control" type="email" id="email" name="email">
    </div>

    <div class="pf-c-form__group">
        <label class="pf-c-form__label" for="roles">Roles</label>
        <input class="pf-c-form-control" type="text" id="roles" name="roles" value="user">
        <div class="pf-c-form__helper">Space or comma separated</div>
    </div>

    <div class="pf-c-form__group pf-c-checkbox">
        <label><input type="checkbox" name="enabled" checked> Enabled</label>
    </div>

    <button class="pf-c-button pf-m-primary" type="submit">Create</button>
    <a class="pf-c-button pf-m-secondary" href="/admin/console/users" style="margin-left:8px">Cancel</a>
</form>
