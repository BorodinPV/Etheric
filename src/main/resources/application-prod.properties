# Production profile — external PostgreSQL/Redis via ETHERIC_* env vars (no localhost defaults).

quarkus.datasource.devservices.enabled=false
quarkus.redis.devservices.enabled=false

quarkus.datasource.username=${ETHERIC_DB_USER}
quarkus.datasource.password=${ETHERIC_DB_PASSWORD}
quarkus.datasource.reactive.url=${ETHERIC_DB_REACTIVE_URL}
quarkus.datasource.jdbc.url=${ETHERIC_DB_JDBC_URL}
quarkus.redis.hosts=${ETHERIC_REDIS_URL}

etheric.docker-compose.auto-start=false
