# PostgreSQL + Redis via docker-compose (auto-started by Maven before tests, or run `docker compose up -d --wait`).
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.redis.devservices.enabled=false
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=etheric
%test.quarkus.datasource.password=etheric
%test.quarkus.datasource.reactive.url=postgresql://localhost:5432/etheric
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/etheric
%test.quarkus.redis.hosts=redis://localhost:6379

%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.locations=db/migration
%test.etheric.session.cookie.secure=true

# Disabled by default in tests; enabled only via RateLimitTestProfile.
%test.etheric.rate-limit.enabled=false
%test.etheric.rate-limit.window-seconds=60
%test.etheric.rate-limit.authorize-max=1000
%test.etheric.rate-limit.login-max=1000
%test.etheric.rate-limit.token-max=1000
%test.etheric.rate-limit.consent-max=1000

%test.etheric.cache.consent-ttl-seconds=86400
